[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cratix"
version = "0.1.0"
description = "自研 Python 打包工具：AOT 编译器 + 单文件/目录发行版打包"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cratix = "cratix.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cratix = ["stub/**/*", "runtime/*.py"]